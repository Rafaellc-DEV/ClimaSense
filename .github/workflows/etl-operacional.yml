# Atualização automática dos dados (RNF-05, RF-19): a mesma rodada da tarefa do Windows, sem depender de um PC ligado.
# Desligado até o dono configurar, no GitHub (Settings > Secrets and variables > Actions):
#   secrets: DATABASE_URL, DATABASE_URL_MIGRACOES, MONGO_URI, MONGO_DB_TERRITORIO (ANA_USUARIO e ANA_SENHA opcionais)
#   variável: ETL_AGENDADO = true
# Pode rodar junto com a tarefa do Windows: a trava no banco e a cadência por fonte evitam carga em dobro.
# O Atlas precisa liberar o acesso de rede dos runners do GitHub. Ver docs/operacao-etl.md, seção K.
name: ETL operacional

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: etl-operacional
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rodada:
    if: vars.ETL_AGENDADO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      AMBIENTE: producao
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_MIGRACOES: ${{ secrets.DATABASE_URL_MIGRACOES }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB_TERRITORIO: ${{ secrets.MONGO_DB_TERRITORIO }}
      ANA_USUARIO: ${{ secrets.ANA_USUARIO }}
      ANA_SENHA: ${{ secrets.ANA_SENHA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: python -m climasense.etl operacional --permitir-remoto
