# Instale uma vez:  pip install pre-commit && pre-commit install
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=4000]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^data/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^data/
  - repo: local
    hooks:
      # o mesmo Prettier do projeto (frontend/package.json), para o hook e o `npm run lint` não brigarem
      - id: prettier
        name: prettier (versão do frontend)
        entry: node frontend/node_modules/prettier/bin/prettier.cjs --write
        language: system
        files: ^frontend/src/
        types_or: [ts, tsx, css, json]
